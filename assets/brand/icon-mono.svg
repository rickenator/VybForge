<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="monoTitle">
  <title id="monoTitle">VybForge monogram — single ink, for light surfaces</title>
  <!-- For dark surfaces use #f2f7ff as the ink. No gradients, no glow: stamps and embosses cleanly. -->
  <g fill="none" stroke="#111924" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="66" y="86" width="380" height="340" rx="104"/>
    <path d="M 196 246 L 256 306 L 316 246"/>
  </g>
  <g fill="#111924">
    <rect x="166" y="172" width="52" height="62" rx="26"/>
    <rect x="294" y="172" width="52" height="62" rx="26"/>
  </g>
</svg>
